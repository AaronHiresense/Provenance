<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROVENANCE — Counterfeit Document & Record Investigator</title>

<!-- Tailwind CSS 3 -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          slate: {

          },
          indigo: {

          },
          emerald: {

          },
          rose: {

            600: '#e11d48',

          amber: {

            600: '#d97706',
          }
        },
        fontFamily: {
          sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],

        }
      }

</script>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>

<!-- React 18 & ReactDOM 18 -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  
  * {
    transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }

  /* Custom scrollbars */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 99px; }
  
  .glass-card-dark {
    background: rgba(17, 23, 38, 0.75);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  
  .glass-card-light {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(226, 232, 240, 0.8);
    box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
  }
</style>
</head>
<body class="bg-slate-950 text-slate-100 dark:bg-slate-950 dark:text-slate-100 light:bg-slate-50 light:text-slate-900 min-h-screen pb-20 selection:bg-indigo-500/30 selection:text-indigo-200">

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

function App() {
  const [theme, setTheme] = useState(localStorage.getItem('theme') || 'dark');
  const [cases, setCases] = useState([]);
  const [selectedCase, setSelectedCase] = useState('');
  const [activeTab, setActiveTab] = useState('library'); // 'library' | 'live' | 'json'
  const [rulesOnly, setRulesOnly] = useState(false);
  const [rawText, setRawText] = useState('');
  const [jsonText, setJsonText] = useState('');
  
  const [status, setStatus] = useState('Ready');
  const [isAnalyzing, setIsAnalyzing] = useState(false);
  const [pipelineStage, setPipelineStage] = useState(0); // 0..5
  const [result, setResult] = useState(null);
  
  const [searchQuery, setSearchQuery] = useState('');
  const [activeDim, setActiveDim] = useState('all');
  const [activeDir, setActiveDir] = useState('all');
  const [viewMode, setViewMode] = useState('table'); // 'table' | 'cards'

  // Apply Theme
  useEffect(() => {
    const root = document.documentElement;
    if (theme === 'dark') {
      root.classList.add('dark');
      root.classList.remove('light');
    } else {
      root.classList.remove('dark');
      root.classList.add('light');
    }
    localStorage.setItem('theme', theme);
  }, [theme]);

  // Load Cases
  useEffect(() => {
    fetch('/api/cases')
      .then(res => res.json())
      .then(data => {
        setCases(data);
        if (data.length > 0) setSelectedCase(data[0].file);
      })
      .catch(err => console.error('Failed to load cases:', err));
  }, []);

  // Run Investigation Analysis
  const runAnalysis = async (payload) => {
    setIsAnalyzing(true);
    setStatus('Investigating dossier...');
    setResult(null);
    setPipelineStage(1);

    const timer1 = setTimeout(() => setPipelineStage(2), 1000);
    const timer2 = setTimeout(() => setPipelineStage(3), 2000);
    const timer3 = setTimeout(() => setPipelineStage(4), 3000);

    try {
      const res = await fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) {
        const errData = await res.json();
        throw new Error(errData.detail || res.statusText);
      }
      const data = await res.json();
      
      setPipelineStage(5);
      setResult(data);
      setStatus(`Case ${data.case_id} completed`);
    } catch (err) {
      setStatus(`Error: ${err.message}`);
      setPipelineStage(0);
    } fontally: {
      clearTimeout(timer1);
      clearTimeout(timer2);
      clearTimeout(timer3);
      setIsAnalyzing(false);
    }
  };

  const handleRunSelectCase = () => {
    if (!selectedCase) return;
    runAnalysis({ case: selectedCase, rules_only: rulesOnly });
  };

  const handleRunRawText = () => {
    if (!rawText.trim()) return;
    runAnalysis({
      raw_text: rawText.trim(),
      case_id: `live-${Date.now().toString(36)}`,
      rules_only: rulesOnly
    });
  };

  const handleRunJson = () => {
    try {
      const dossier = JSON.parse(jsonText);
      runAnalysis({ dossier, rules_only: rulesOnly });
    } catch (e) {
      alert(`Invalid JSON format: ${e.message}`);
    }
  };

  // Filtered findings for ledger
  const filteredFindings = useMemo(() => {
    if (!result || !result.ledger || !result.ledger.findings) return [];
    return result.ledger.findings.filter(f => {
      const matchesDim = activeDim === 'all' || f.dimension === activeDim;
      const matchesDir = activeDir === 'all' || f.direction === activeDir;
      const q = searchQuery.toLowerCase().trim();
      const matchesQuery = !q || (
        f.check.toLowerCase().includes(q) ||
        f.assertion.toLowerCase().includes(q) ||
        f.detail.toLowerCase().includes(q) ||
        f.result.toLowerCase().includes(q) ||
        f.dimension.toLowerCase().includes(q)
      );
      return matchesDim && matchesDir && matchesQuery;
    });
  }, [result, activeDim, activeDir, searchQuery]);

  return (
    <div className="max-w-5xl mx-auto px-4 sm:px-6 pt-8 space-y-8">
      
      {/* ---------- HEADER ---------- */}
      <header className="flex items-center justify-between pb-6 border-b border-slate-800 dark:border-slate-800 light:border-slate-200">
        <div className="flex items-center gap-3.5">
          <div className="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-extrabold text-xl shadow-lg shadow-indigo-600/25">
            P
          </div>
          <div>
            <div className="flex items-center gap-2">
              <h1 className="text-xl font-bold tracking-tight text-slate-100 dark:text-slate-100 light:text-slate-900">PROVENANCE</h1>
              <span className="px-2.5 py-0.5 rounded-md text-[11px] font-mono font-semibold bg-indigo-500/10 text-indigo-400 dark:text-indigo-400 light:text-indigo-700 border border-indigo-500/20">
                Document Investigator
              </span>
            </div>
            <p className="text-xs text-slate-400 dark:text-slate-400 light:text-slate-500">Counterfeit Auto-Parts & Registry Verification System</p>
          </div>
        </div>

        <div className="flex items-center gap-3">
          <div className="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-900 dark:bg-slate-900 light:bg-white border border-slate-800 dark:border-slate-800 light:border-slate-200 text-xs font-mono text-slate-400 dark:text-slate-400 light:text-slate-600 shadow-sm">
            <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            MCA Registry · 3.67M Records
          </div>

          <div className="px-3 py-1.5 rounded-full bg-slate-900 dark:bg-slate-900 light:bg-white border border-slate-800 dark:border-slate-800 light:border-slate-200 text-xs font-mono text-amber-400 dark:text-amber-400 light:text-amber-600 flex items-center gap-2 shadow-sm">
            <span className="w-2 h-2 rounded-full bg-amber-500"></span>
            ENGINE: {result ? result.llm_provider.toUpperCase() : 'READY'}
          </div>

          <button
            onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
            className="p-2 rounded-xl bg-slate-900 dark:bg-slate-900 light:bg-white hover:bg-slate-800 dark:hover:bg-slate-800 light:hover:bg-slate-100 border border-slate-800 dark:border-slate-800 light:border-slate-200 text-slate-400 dark:text-slate-400 light:text-slate-600 transition-colors shadow-sm"
            title="Toggle Light/Dark Theme"
          >
            {theme === 'dark' ? '🌙' : '☀️'}
          </button>
        </div>
      </header>

      {/* ---------- WORKBENCH CONTAINER ---------- */}
      <section className="bg-slate-900/60 dark:bg-slate-900/60 light:bg-white border border-slate-800 dark:border-slate-800 light:border-slate-200 rounded-2xl p-6 shadow-xl space-y-6">
        
        {/* Tab Controls */}
        <div className="flex items-center gap-2 border-b border-slate-800 dark:border-slate-800 light:border-slate-200 pb-4">
          <button
            onClick={() => setActiveTab('library')}
            className={`px-4 py-2 rounded-lg text-xs font-semibold transition-all ${
              activeTab === 'library'
                ? 'bg-indigo-600 text-white shadow-sm'
                : 'text-slate-400 dark:text-slate-400 light:text-slate-600 hover:text-slate-200 dark:hover:text-slate-200 light:hover:text-slate-900 hover:bg-slate-800/50 dark:hover:bg-slate-800/50 light:hover:bg-slate-100'
            }`}
          >
            Prepared Case Studies
          </button>
          
          <button
            onClick={() => setActiveTab('live')}
            className={`px-4 py-2 rounded-lg text-xs font-semibold transition-all ${
              activeTab === 'live'
                ? 'bg-indigo-600 text-white shadow-sm'
                : 'text-slate-400 dark:text-slate-400 light:text-slate-600 hover:text-slate-200 dark:hover:text-slate-200 light:hover:text-slate-900 hover:bg-slate-800/50 dark:hover:bg-slate-800/50 light:hover:bg-slate-100'
            }`}
          >
            Paste Document Text
          </button>
          
          <button
            onClick={() => setActiveTab('json')}
            className={`px-4 py-2 rounded-lg text-xs font-semibold transition-all ${
              activeTab === 'json'
                ? 'bg-indigo-600 text-white shadow-sm'
                : 'text-slate-400 dark:text-slate-400 light:text-slate-600 hover:text-slate-200 dark:hover:text-slate-200 light:hover:text-slate-900 hover:bg-slate-800/50 dark:hover:bg-slate-800/50 light:hover:bg-slate-100'
            }`}
          >
            Raw Dossier JSON
          </button>
        </div>

        {/* Tab 1: Library */}
        {activeTab === 'library' && (
          <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-4">
            <div className="flex-1 space-y-1.5">
              <label className="text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-400 light:text-slate-500 font-mono">Select Investigation Dossier</label>
              <select
                value={selectedCase}
                onChange={e => setSelectedCase(e.target.value)}
                className="w-full bg-slate-950 dark:bg-slate-950 light:bg-slate-50 text-slate-100 dark:text-slate-100 light:text-slate-900 border border-slate-800 dark:border-slate-800 light:border-slate-300 rounded-xl px-4 py-3 text-sm outline-none focus:border-indigo-500 transition-all cursor-pointer"
              >
                {cases.map(c => (
                  <option key={c.file} value={c.file}>
                    {c.title} ({c.documents} documents)
                  </option>
                ))}
              </select>
            </div>

            <div className="flex items-center gap-5 pt-2 sm:pt-6">
              <label className="flex items-center gap-3 cursor-pointer select-none">
                <input
                  type="checkbox"
                  checked={rulesOnly}
                  onChange={e => setRulesOnly(e.target.checked)}
                  className="sr-only peer"
                />
                <div className="w-10 h-6 bg-slate-800 dark:bg-slate-800 light:bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600 relative"></div>
                <span className="text-xs font-medium text-slate-300 dark:text-slate-300 light:text-slate-700">Rules-Only Mode</span>
              </label>

              <button
                onClick={handleRunSelectCase}
                disabled={isAnalyzing || !selectedCase}
                className="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm shadow-md shadow-indigo-600/20 transition-all disabled:opacity-50 flex items-center gap-2"
              >
                {isAnalyzing ? (
                  <>
                    <svg className="animate-spin h-4 w-4 text-white" viewBox="0 0 24 24" fill="none">
                      <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                      <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>Investigating...</span>
                  </>
                ) : (
                  <>
                    <span>⚡ Run Investigation</span>
                  </>
                )}
              </button>
            </div>
          </div>
        )}

        {/* Tab 2: Raw Text */}
        {activeTab === 'live' && (
          <div className="space-y-4">
            <textarea
              value={rawText}
              onChange={e => setRawText(e.target.value)}
              placeholder="Paste unformatted document text here... Separate multiple documents with lines containing ---"
              className="w-full h-36 bg-slate-950 dark:bg-slate-950 light:bg-slate-50 text-slate-100 dark:text-slate-100 light:text-slate-900 border border-slate-800 dark:border-slate-800 light:border-slate-300 rounded-xl p-4 font-mono text-xs outline-none focus:border-indigo-500"
            />
            <div className="flex items-center justify-between">
              <span className="text-xs text-slate-400 dark:text-slate-400 light:text-slate-500">Autonomous extraction agent will parse and normalize factual assertions.</span>
              <button
                onClick={handleRunRawText}
                disabled={isAnalyzing || !rawText.trim()}
                className="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow-md transition-all disabled:opacity-50"
              >
                Analyze Raw Text
              </button>
            </div>
          </div>
        )}

        {/* Tab 3: JSON */}
        {activeTab === 'json' && (
          <div className="space-y-4">
            <textarea
              value={jsonText}
              onChange={e => setJsonText(e.target.value)}
              placeholder='{"case_id": "custom", "documents": [{"doc_id": "DOC-1", "doc_type": "tax_invoice", "text": "..."}]}'
              className="w-full h-36 bg-slate-950 dark:bg-slate-950 light:bg-slate-50 text-slate-100 dark:text-slate-100 light:text-slate-900 border border-slate-800 dark:border-slate-800 light:border-slate-300 rounded-xl p-4 font-mono text-xs outline-none focus:border-indigo-500"
            />
            <div className="flex justify-end">
              <button
                onClick={handleRunJson}
                disabled={isAnalyzing || !jsonText.trim()}
                className="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow-md transition-all disabled:opacity-50"
              >
                Analyze JSON Dossier
              </button>
            </div>
          </div>
        )}

        <div className="text-xs font-mono text-slate-400 dark:text-slate-400 light:text-slate-500 pt-2 border-t border-slate-800/60 dark:border-slate-800/60 light:border-slate-200">
          Status: {status}
        </div>
      </section>

      {/* ---------- PIPELINE STEPPER ---------- */}
      <section className="bg-slate-900/60 dark:bg-slate-900/60 light:bg-white border border-slate-800 dark:border-slate-800 light:border-slate-200 rounded-2xl p-6 shadow-xl space-y-4">
        <div className="flex items-center justify-between">
          <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-400 light:text-slate-500 font-mono">Pipeline Progress</h3>
          <span className="text-xs font-mono text-indigo-400 dark:text-indigo-400 light:text-indigo-600">
            {pipelineStage === 0 ? 'idle' : `stage ${pipelineStage}/5`}
          </span>
        </div>

        <div className="relative flex items-center justify-between px-4 pt-2">
          {/* Rail Track */}
          <div className="absolute left-10 right-10 top-6 h-0.5 bg-slate-800 dark:bg-slate-800 light:bg-slate-200 z-0">
            <div
              className="h-full bg-indigo-500 transition-all duration-500"
              style={{ width: `${Math.max(0, (pipelineStage - 1) * 25)}%` }}
            ></div>
          </div>

          {/* Step Nodes */}
          {[
            { num: 1, label: 'Extract' },
            { num: 2, label: 'Validate' },
            { num: 3, label: 'Ledger' },
            { num: 4, label: 'Reason' },
            { num: 5, label: 'Verdict' },
          ].map(step => {
            const isDone = pipelineStage > step.num || (pipelineStage === 5 && result);
            const isActive = pipelineStage === step.num && !result;

            return (
              <div key={step.num} className="flex flex-col items-center gap-2 z-10">
                <div
                  className={`w-8 h-8 rounded-full border-2 font-mono text-xs font-bold flex items-center justify-center transition-all ${
                    isDone
                      ? 'bg-emerald-500/20 border-emerald-500 text-emerald-400'
                      : isActive
                      ? 'bg-indigo-600 border-indigo-400 text-white shadow-lg shadow-indigo-600/30 animate-pulse'
                      : 'bg-slate-950 dark:bg-slate-950 light:bg-white border-slate-800 dark:border-slate-800 light:border-slate-300 text-slate-400'
                  }`}
                >
                  {isDone ? '✓' : step.num}
                </div>
                <span className={`text-xs font-medium ${
                  isDone || isActive ? 'text-slate-200 dark:text-slate-200 light:text-slate-900 font-semibold' : 'text-slate-400 dark:text-slate-400 light:text-slate-500'
                }`}>
                  {step.label}
                </span>
              </div>
            );
          })}
        </div>
      </section>

      {/* ---------- BANNERS ---------- */}
      {result && result.aliased && (
        <div className="p-4 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-xs text-indigo-300 dark:text-indigo-300 light:text-indigo-800">
          ℹ️ <b>Aliased Entities Notice:</b> Display names in this case study are aliased for privacy. Verification runs against authentic MCA company registry records.
        </div>
      )}

      {result && result.injection_flags?.length > 0 && (
        <div className="p-4 rounded-xl bg-rose-500/10 border border-rose-500/20 text-xs text-rose-400 dark:text-rose-400 light:text-rose-700 space-y-2">
          <b>⚠️ Prompt Injection Attempt Blocked & Logged as Tamper Evidence</b>
          <div className="space-y-1 font-mono text-[11px]">
            {result.injection_flags.map((f, i) => (
              <div key={i}><b>{f.source_doc}</b>: "{f.content}"</div>
            ))}
          </div>
        </div>
      )}

      {/* ---------- VERDICT HERO ---------- */}
      {result && (
        <section className="space-y-6">
          <div className="bg-slate-900/60 dark:bg-slate-900/60 light:bg-white border border-slate-800 dark:border-slate-800 light:border-slate-200 rounded-2xl overflow-hidden shadow-xl transition-all">
            {/* Verdict Header */}
            <div className={`p-6 sm:p-8 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6 border-b border-slate-800 dark:border-slate-800 light:border-slate-200 ${
              result.verdict === 'GENUINE' ? 'bg-emerald-500/10' : result.verdict === 'SUSPECT' ? 'bg-rose-500/10' : 'bg-amber-500/10'
            }`}>
              <div>
                <div className="flex items-center gap-3">
                  <h2 className={`text-4xl font-black font-mono tracking-wider ${
                    result.verdict === 'GENUINE' ? 'text-emerald-500' : result.verdict === 'SUSPECT' ? 'text-rose-500' : 'text-amber-500'
                  }`}>
                    {result.verdict}
                  </h2>
                </div>
                <p className="text-xs font-mono text-slate-400 dark:text-slate-400 light:text-slate-500 mt-2">
                  {result.subtype ? `subtype: ${result.subtype} · ` : ''}
                  {result.rules_only ? 'deterministic rules-only execution' : 'full pipeline execution (validators + LLM reasoning)'}
                </p>
              </div>

              {/* Counts */}
              <div className="flex items-center gap-3">
                <div className="px-4 py-2 rounded-xl bg-slate-950 dark:bg-slate-950 light:bg-slate-100 border border-slate-800 dark:border-slate-800 light:border-slate-200 text-center min-w-[80px]">
                  <div className="text-xl font-bold font-mono text-rose-500">{result.counts.supports_suspect}</div>
                  <div className="text-[10px] uppercase font-semibold text-slate-400">Suspect</div>
                </div>
                <div className="px-4 py-2 rounded-xl bg-slate-950 dark:bg-slate-950 light:bg-slate-100 border border-slate-800 dark:border-slate-800 light:border-slate-200 text-center min-w-[80px]">
                  <div className="text-xl font-bold font-mono text-emerald-500">{result.counts.supports_genuine}</div>
                  <div className="text-[10px] uppercase font-semibold text-slate-400">Genuine</div>
                </div>
                <div className="px-4 py-2 rounded-xl bg-slate-950 dark:bg-slate-950 light:bg-slate-100 border border-slate-800 dark:border-slate-800 light:border-slate-200 text-center min-w-[80px]">
                  <div className="text-xl font-bold font-mono text-slate-400">{result.counts.neutral}</div>
                  <div className="text-[10px] uppercase font-semibold text-slate-400">Neutral</div>
                </div>
              </div>
            </div>

            {/* Verdict Body */}
            <div className="p-6 sm:p-8 space-y-6">
              {result.verdict === 'UNVERIFIABLE' && (
                <div className="p-5 rounded-xl bg-amber-500/10 border border-amber-500/20 space-y-2">
                  <h4 className="text-xs font-bold uppercase tracking-wider text-amber-500 font-mono">Decisive Missing Artefact</h4>
                  <p className="text-sm font-semibold text-slate-100 dark:text-slate-100 light:text-slate-900">{result.missing_artefact}</p>
                  <p className="text-xs text-slate-400 dark:text-slate-400 light:text-slate-600"><b>Interim Action Work-Order:</b> {result.interim_action}</p>
                  {result.lean && (
                    <div className="text-xs font-mono text-amber-400 dark:text-amber-400 light:text-amber-700 pt-2 border-t border-amber-500/20">
                      ▸ Directional Lean: {result.lean.direction.toUpperCase()} ({result.lean.confidence} confidence) — {result.lean.basis}
                    </div>
                  )}
                </div>
              )}

              <div>
                <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-400 light:text-slate-500 font-mono mb-3">Protocol Actions</h4>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {Object.entries(result.actions).map(([role, text]) => (
                    <div key={role} className="p-4 rounded-xl bg-slate-950 dark:bg-slate-950 light:bg-slate-50 border border-slate-800 dark:border-slate-800 light:border-slate-200 space-y-1">
                      <div className="text-xs font-bold uppercase text-indigo-500 font-mono">{role} Action</div>
                      <p className="text-xs text-slate-300 dark:text-slate-300 light:text-slate-700 leading-relaxed">{text}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>

          {/* ---------- EVIDENCE AUDIT LEDGER ---------- */}
          <div className="bg-slate-900/60 dark:bg-slate-900/60 light:bg-white border border-slate-800 dark:border-slate-800 light:border-slate-200 rounded-2xl p-6 shadow-xl space-y-6">
            <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
              <div>
                <h3 className="text-lg font-bold text-slate-100 dark:text-slate-100 light:text-slate-900">Evidence Audit Ledger</h3>
                <p className="text-xs text-slate-400 dark:text-slate-400 light:text-slate-500">{filteredFindings.length} findings logged — verified audit trail</p>
              </div>

              <div className="flex items-center gap-3 w-full md:w-auto">
                <div className="relative flex-1 md:w-64">
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    placeholder="Filter findings (CIN, Delhi, fail)..."
                    className="w-full bg-slate-950 dark:bg-slate-950 light:bg-slate-50 border border-slate-800 dark:border-slate-800 light:border-slate-300 rounded-xl px-3 py-1.5 text-xs text-slate-100 dark:text-slate-100 light:text-slate-900 outline-none focus:border-indigo-500"
                  />
                </div>

                <div className="flex items-center gap-1 bg-slate-950 dark:bg-slate-950 light:bg-slate-100 p-1 rounded-xl border border-slate-800 dark:border-slate-800 light:border-slate-200 text-xs">
                  <button
                    onClick={() => setViewMode('table')}
                    className={`px-3 py-1 rounded-lg font-medium transition-all ${
                      viewMode === 'table' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-400 dark:text-slate-400 light:text-slate-600 hover:text-slate-200'
                    }`}
                  >
                    Table
                  </button>
                  <button
                    onClick={() => setViewMode('cards')}
                    className={`px-3 py-1 rounded-lg font-medium transition-all ${
                      viewMode === 'cards' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-400 dark:text-slate-400 light:text-slate-600 hover:text-slate-200'
                    }`}
                  >
                    Cards
                  </button>
                </div>
              </div>
            </div>

            {/* Filter Chips */}
            <div className="flex items-center gap-2 flex-wrap text-xs">
              {['all', 'identity', 'certification', 'custody', 'provenance'].map(dim => (
                <button
                  key={dim}
                  onClick={() => setActiveDim(dim)}
                  className={`px-3 py-1 rounded-full text-xs font-medium transition-all ${
                    activeDim === dim
                      ? 'bg-indigo-600 text-white'
                      : 'bg-slate-900 dark:bg-slate-900 light:bg-slate-200 text-slate-400 dark:text-slate-400 light:text-slate-700 hover:bg-slate-800'
                  }`}
                >
                  {dim}
                </button>
              ))}

              <span className="mx-1 text-slate-600">|</span>

              {['all', 'supports_suspect', 'supports_genuine'].map(dir => (
                <button
                  key={dir}
                  onClick={() => setActiveDir(dir)}
                  className={`px-3 py-1 rounded-full text-xs font-medium transition-all ${
                    activeDir === dir
                      ? 'bg-indigo-600 text-white'
                      : 'bg-slate-900 dark:bg-slate-900 light:bg-slate-200 text-slate-400 dark:text-slate-400 light:text-slate-700 hover:bg-slate-800'
                  }`}
                >
                  {dir.replace('supports_', '')}
                </button>
              ))}
            </div>

            {/* Table View */}
            {viewMode === 'table' ? (
              <div className="overflow-x-auto rounded-xl border border-slate-800 dark:border-slate-800 light:border-slate-200">
                <table className="w-full text-left text-xs">
                  <thead className="bg-slate-950 dark:bg-slate-950 light:bg-slate-100 text-slate-400 dark:text-slate-400 light:text-slate-600 uppercase font-mono text-[10px] border-b border-slate-800 dark:border-slate-800 light:border-slate-200">
                    <tr>
                      <th className="p-3">Check & Category</th>
                      <th className="p-3">Assertion & Details</th>
                      <th className="p-3">Status / Direction</th>
                      <th className="p-3">Reasoner Ruling</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/60 dark:divide-slate-800/60 light:divide-slate-200">
                    {filteredFindings.map((f, idx) => {
                      const isGenuine = f.direction === 'supports_genuine';
                      const isSuspect = f.direction === 'supports_suspect';
                      const icon = isGenuine ? '✓' : isSuspect ? '✗' : '•';
                      const badgeCls = isGenuine
                        ? 'bg-emerald-500/10 text-emerald-500 border-emerald-500/30'
                        : isSuspect
                        ? 'bg-rose-500/10 text-rose-500 border-rose-500/30'
                        : 'bg-slate-800 text-slate-400 border-slate-700';

                      return (
                        <tr key={idx} className="hover:bg-slate-800/30 transition-colors">
                          <td className="p-3 align-top">
                            <div className="font-mono font-semibold text-slate-200 dark:text-slate-200 light:text-slate-900 text-xs">{f.check}</div>
                            <div className="flex items-center gap-1.5 mt-1">
                              <span className={`px-1.5 py-0.5 rounded text-[10px] font-mono ${
                                f.source_tier === 'authoritative'
                                  ? 'bg-indigo-500/20 text-indigo-400 border border-indigo-500/30'
                                  : 'bg-slate-800 dark:bg-slate-800 light:bg-slate-200 text-slate-400 dark:text-slate-400 light:text-slate-600'
                              }`}>
                                {f.source_tier}
                              </span>
                              <span className="text-[10px] text-slate-500 dark:text-slate-500 light:text-slate-400 font-mono">{f.dimension}</span>
                            </div>
                          </td>

                          <td className="p-3 align-top">
                            <div className="font-semibold text-slate-100 dark:text-slate-100 light:text-slate-900 text-xs">{f.assertion}</div>
                            <div className="text-slate-400 dark:text-slate-400 light:text-slate-600 text-xs mt-0.5 leading-relaxed">{f.detail}</div>
                          </td>

                          <td className="p-3 align-top whitespace-nowrap">
                            <span className={`px-2.5 py-1 rounded-full text-[11px] font-mono font-semibold border inline-flex items-center gap-1 ${badgeCls}`}>
                              {icon} {f.direction.replace('supports_', '').toUpperCase()} ({f.result})
                            </span>
                          </td>

                          <td className="p-3 align-top text-xs text-slate-400">—</td>
                        </tr>
                      );
                    })}
                    {filteredFindings.length === 0 && (
                      <tr>
                        <td colSpan="4" className="p-6 text-center text-slate-500">No findings match your search filter.</td>
                      </tr>
                    )}
                  </tbody>
                </table>
              </div>
            ) : (
              /* Cards View */
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {filteredFindings.map((f, idx) => (
                  <div key={idx} className="p-4 rounded-xl bg-slate-950 dark:bg-slate-950 light:bg-slate-50 border border-slate-800 dark:border-slate-800 light:border-slate-200 space-y-2">
                    <div className="flex items-center justify-between font-mono text-xs">
                      <span className="font-semibold text-indigo-400">{f.check}</span>
                      <span className={`px-2 py-0.5 rounded text-[10px] ${
                        f.direction === 'supports_genuine' ? 'bg-emerald-500/10 text-emerald-500' : 'bg-rose-500/10 text-rose-500'
                      }`}>
                        {f.direction.replace('supports_', '')}
                      </span>
                    </div>
                    <div className="text-xs font-semibold text-slate-100 dark:text-slate-100 light:text-slate-900">{f.assertion}</div>
                    <p className="text-xs text-slate-400 dark:text-slate-400 light:text-slate-600">{f.detail}</p>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* ---------- AGENT DELIBERATION ---------- */}
          {result.reasoning && !result.rules_only && (
            <div className="bg-slate-900/60 dark:bg-slate-900/60 light:bg-white border border-slate-800 dark:border-slate-800 light:border-slate-200 rounded-2xl p-6 shadow-xl space-y-6">
              <div className="flex items-center justify-between">
                <h3 className="text-lg font-bold text-slate-100 dark:text-slate-100 light:text-slate-900">Agent Deliberation & Reasoning</h3>
                <span className="px-3 py-1 rounded-full text-xs font-mono bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
                  Engine: {result.reasoning.engine}
                </span>
              </div>

              {result.reasoning.narrative && (
                <div className="p-5 rounded-xl bg-slate-950 dark:bg-slate-950 light:bg-slate-50 border-l-4 border-indigo-500 text-sm text-slate-200 dark:text-slate-200 light:text-slate-800 leading-relaxed">
                  {result.reasoning.narrative}
                </div>
              )}

              {/* Contradictions */}
              <div className="space-y-4">
                {(result.reasoning.contradictions || []).map((c, i) => (
                  <div key={i} className="p-5 rounded-xl bg-slate-955 dark:bg-slate-950 light:bg-slate-50 border border-slate-800 dark:border-slate-800 light:border-slate-200 space-y-4">
                    <div className="flex items-center justify-between font-mono text-xs">
                      <span className="font-semibold text-slate-200 dark:text-slate-200 light:text-slate-800">Topic: {c.topic}</span>
                      <span className="px-2.5 py-1 rounded-full bg-slate-800 dark:bg-slate-800 light:bg-slate-200 text-indigo-400 dark:text-indigo-400 light:text-indigo-700">{c.resolved_direction}</span>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div className="p-4 rounded-xl bg-emerald-500/5 border-l-2 border-emerald-500 space-y-1">
                        <div className="text-[10px] font-bold uppercase text-emerald-500 font-mono">Benign Hypothesis</div>
                        <p className="text-xs text-slate-300 dark:text-slate-300 light:text-slate-700">{c.benign}</p>
                      </div>
                      <div className="p-4 rounded-xl bg-rose-500/5 border-l-2 border-rose-500 space-y-1">
                        <div className="text-[10px] font-bold uppercase text-rose-500 font-mono">Malicious Hypothesis</div>
                        <p className="text-xs text-slate-300 dark:text-slate-300 light:text-slate-700">{c.malicious}</p>
                      </div>
                    </div>
                    <div className="p-3 rounded-lg bg-slate-900 dark:bg-slate-900 light:bg-white text-xs text-slate-300 dark:text-slate-300 light:text-slate-700 border border-slate-800 dark:border-slate-800 light:border-slate-200">
                      <b>Resolution:</b> {c.resolution}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* ---------- KNOWN LIMITS ---------- */}
          <div className="bg-slate-900/60 dark:bg-slate-900/60 light:bg-white border border-slate-800 dark:border-slate-800 light:border-slate-200 rounded-2xl p-6 shadow-xl space-y-4">
            <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-400 light:text-slate-500 font-mono">Known System Boundaries</h3>
            <ol className="space-y-2 text-xs text-slate-400 dark:text-slate-400 light:text-slate-600 list-decimal list-inside">
              {(result.cannot_determine || []).map((item, i) => (
                <li key={i}>{item}</li>
              ))}
            </ol>
          </div>
        </section>
      )}

      {/* ---------- FOOTER ---------- */}
      <footer className="text-center text-xs font-mono text-slate-400 dark:text-slate-400 light:text-slate-500 pt-8 border-t border-slate-800 dark:border-slate-800 light:border-slate-200">
        PROVENANCE · Offline MCA Registry Snapshot 2026-07-22 · Feature Branch: feature/ui-redesign
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
