<!DOCTYPE html>
<html lang="en" class="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROVENANCE — Document Intelligence & Registry Verification</title>

<!-- Tailwind CSS 3 -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          slate: {
            750: '#1e293b',
            850: '#0f172a',
            950: '#090d16',
          },
          brand: {
            50: '#eff6ff',
            100: '#dbeafe',
            500: '#3b82f6',
            600: '#2563eb',
            700: '#1d4ed8',
            900: '#1e3a8a',
          }
        },
        fontFamily: {
          sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          mono: ['JetBrains Mono', 'Fira Code', 'Menlo', 'monospace'],
        }
      }
    }
  }
</script>

<!-- Google Fonts: Inter & JetBrains Mono -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- React 18 & ReactDOM 18 & Babel Standalone -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }
  
  * {
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
  }

  /* Custom scrollbars */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.25); border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.5); }

  html.light body {
    background-color: #f8fafc;
    color: #0f172a;
  }

  html.dark body {
    background-color: #090d16;
    color: #f8fafc;
  }

  .panel-base {
    border-radius: 12px;
  }

  html.light .panel-base {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.04), 0 1px 2px -1px rgba(0, 0, 0, 0.04);
  }

  html.dark .panel-base {
    background: #0f172a;
    border: 1px solid #1e293b;
    box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.4);
  }
</style>
</head>
<body class="min-h-screen pb-16 selection:bg-blue-500/20 selection:text-blue-700">

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// --- ELEGANT INLINE SVG ICONS ---
const ShieldIcon = ({ className = "w-4 h-4" }) => (
  <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.75}>
    <path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
  </svg>
);

const AlertTriangleIcon = ({ className = "w-4 h-4" }) => (
  <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.75}>
    <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
  </svg>
);

const CheckCircleIcon = ({ className = "w-4 h-4" }) => (
  <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.75}>
    <path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
  </svg>
);

const XCircleIcon = ({ className = "w-4 h-4" }) => (
  <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.75}>
    <path strokeLinecap="round" strokeLinejoin="round" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
  </svg>
);

const SearchIcon = ({ className = "w-4 h-4" }) => (
  <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.75}>
    <path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
  </svg>
);

const FileTextIcon = ({ className = "w-4 h-4" }) => (
  <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.75}>
    <path strokeLinecap="round" strokeLinejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
  </svg>
);

const CpuIcon = ({ className = "w-4 h-4" }) => (
  <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.75}>
    <path strokeLinecap="round" strokeLinejoin="round" d="M9 3v2m6-2v2M9 19v2m6-2v2M3 9h2m-2 6h2m14-6h2m-2 6h2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z" />
  </svg>
);

const LayersIcon = ({ className = "w-4 h-4" }) => (
  <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.75}>
    <path strokeLinecap="round" strokeLinejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
  </svg>
);

const PlayIcon = ({ className = "w-4 h-4" }) => (
  <svg className={className} fill="currentColor" viewBox="0 0 24 24">
    <path d="M8 5v14l11-7z" />
  </svg>
);

const RefreshIcon = ({ className = "w-4 h-4" }) => (
  <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.75}>
    <path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
  </svg>
);

const MoonIcon = ({ className = "w-4 h-4" }) => (
  <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.75}>
    <path strokeLinecap="round" strokeLinejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
  </svg>
);

const SunIcon = ({ className = "w-4 h-4" }) => (
  <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.75}>
    <path strokeLinecap="round" strokeLinejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
  </svg>
);

function App() {
  const [theme, setTheme] = useState(localStorage.getItem('theme') || 'light');
  const [cases, setCases] = useState([]);
  const [selectedCase, setSelectedCase] = useState('');
  const [currentDossierDetails, setCurrentDossierDetails] = useState(null);
  const [activeTab, setActiveTab] = useState('library'); // 'library' | 'live' | 'json'
  const [rulesOnly, setRulesOnly] = useState(false);
  const [rawText, setRawText] = useState('');
  const [jsonText, setJsonText] = useState('');
  
  const [status, setStatus] = useState('Ready');
  const [isAnalyzing, setIsAnalyzing] = useState(false);
  const [pipelineStage, setPipelineStage] = useState(0); // 0..5
  const [result, setResult] = useState(null);
  
  // Ledger controls
  const [searchQuery, setSearchQuery] = useState('');
  const [activeDim, setActiveDim] = useState('all');
  const [activeDir, setActiveDir] = useState('all');
  const [activeTier, setActiveTier] = useState('all');
  const [activeMainTab, setActiveMainTab] = useState('ledger'); // 'ledger' | 'deliberation' | 'documents'

  useEffect(() => {
    const root = document.documentElement;
    if (theme === 'dark') {
      root.classList.add('dark');
      root.classList.remove('light');
    } else {
      root.classList.remove('dark');
      root.classList.add('light');
    }
    localStorage.setItem('theme', theme);
  }, [theme]);

  useEffect(() => {
    fetch('/api/cases')
      .then(res => res.json())
      .then(data => {
        setCases(data);
        if (data.length > 0) setSelectedCase(data[0].file);
      })
      .catch(err => console.error('Failed to load cases:', err));
  }, []);

  useEffect(() => {
    if (!selectedCase) return;
    fetch(`/api/cases/${selectedCase}`)
      .then(res => res.json())
      .then(dossier => setCurrentDossierDetails(dossier))
      .catch(err => console.error('Failed to fetch case details:', err));
  }, [selectedCase]);

  const runAnalysis = async (payload) => {
    setIsAnalyzing(true);
    setStatus('Extracting dossier assertions...');
    setResult(null);
    setPipelineStage(1);

    const timer1 = setTimeout(() => { setPipelineStage(2); setStatus('Validating against MCA registry...'); }, 700);
    const timer2 = setTimeout(() => { setPipelineStage(3); setStatus('Assembling audit ledger...'); }, 1400);
    const timer3 = setTimeout(() => { setPipelineStage(4); setStatus('Evaluating intent hypotheses...'); }, 2100);

    try {
      const res = await fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) {
        const errData = await res.json();
        throw new Error(errData.detail || res.statusText);
      }
      const data = await res.json();
      setPipelineStage(5);
      setResult(data);
      setStatus(`Completed case ${data.case_id}`);
    } catch (err) {
      setStatus(`Error: ${err.message}`);
      setPipelineStage(0);
    } fontally: {
      clearTimeout(timer1);
      clearTimeout(timer2);
      clearTimeout(timer3);
      setIsAnalyzing(false);
    }
  };

  const handleRunSelectCase = () => {
    if (!selectedCase) return;
    runAnalysis({ case: selectedCase, rules_only: rulesOnly });
  };

  const handleRunRawText = () => {
    if (!rawText.trim()) return;
    runAnalysis({
      raw_text: rawText.trim(),
      case_id: `live-${Date.now().toString(36)}`,
      rules_only: rulesOnly
    });
  };

  const handleRunJson = () => {
    try {
      const dossier = JSON.parse(jsonText);
      runAnalysis({ dossier, rules_only: rulesOnly });
    } catch (e) {
      alert(`Invalid JSON: ${e.message}`);
    }
  };

  const filteredFindings = useMemo(() => {
    if (!result || !result.ledger || !result.ledger.findings) return [];
    return result.ledger.findings.filter(f => {
      const matchesDim = activeDim === 'all' || f.dimension === activeDim;
      const matchesDir = activeDir === 'all' || f.direction === activeDir;
      const matchesTier = activeTier === 'all' || f.source_tier === activeTier;
      const q = searchQuery.toLowerCase().trim();
      const matchesQuery = !q || (
        (f.check && f.check.toLowerCase().includes(q)) ||
        (f.assertion && f.assertion.toLowerCase().includes(q)) ||
        (f.detail && f.detail.toLowerCase().includes(q)) ||
        (f.dimension && f.dimension.toLowerCase().includes(q))
      );
      return matchesDim && matchesDir && matchesTier && matchesQuery;
    });
  }, [result, activeDim, activeDir, activeTier, searchQuery]);

  const selectedCaseObj = useMemo(() => cases.find(c => c.file === selectedCase), [cases, selectedCase]);

  return (
    <div className="min-h-screen flex flex-col">
      
      {/* ---------- SENIOR NAVBAR ---------- */}
      <header className="h-14 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md sticky top-0 z-40 px-4 sm:px-8 flex items-center justify-between">
        
        {/* Left: Brand & Breadcrumb */}
        <div className="flex items-center gap-3">
          <div className="w-7 h-7 rounded-lg bg-slate-900 dark:bg-white text-white dark:text-slate-900 flex items-center justify-center font-bold text-sm tracking-tight shadow-sm">
            P
          </div>
          <div className="flex items-center gap-2 text-sm">
            <span className="font-semibold text-slate-900 dark:text-white tracking-tight">PROVENANCE</span>
            <span className="text-slate-300 dark:text-slate-700">/</span>
            <span className="text-slate-500 dark:text-slate-400 font-medium text-xs">Document Intelligence</span>
          </div>
        </div>

        {/* Right: Status Pill & Theme Toggle */}
        <div className="flex items-center gap-4 text-xs">
          <div className="hidden md:flex items-center gap-2 px-2.5 py-1 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-mono text-[11px]">
            <span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
            <span>MCA DuckDB: 3.67M Records</span>
          </div>

          <div className="flex items-center gap-2 px-2.5 py-1 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-mono text-[11px]">
            <CpuIcon className="w-3.5 h-3.5 text-slate-400" />
            <span>Engine: {result ? result.llm_provider.toUpperCase() : 'Ready'}</span>
          </div>

          <button
            onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
            className="p-1.5 rounded-md hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 dark:text-slate-400 transition-colors"
            title="Toggle theme"
          >
            {theme === 'dark' ? <SunIcon className="w-4 h-4 text-amber-400" /> : <MoonIcon className="w-4 h-4 text-indigo-600" />}
          </button>
        </div>
      </header>

      {/* ---------- MAIN TWO-COLUMN WORKSPACE ---------- */}
      <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
        {/* LEFT COLUMN: CONTROL PANEL (4 Cols) */}
        <aside className="lg:col-span-4 space-y-6">
          
          <div className="panel-base p-5 space-y-5">
            <div>
              <h2 className="text-sm font-semibold text-slate-900 dark:text-white">Investigation Dossier</h2>
              <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Select a case study or paste raw document text to verify.</p>
            </div>

            {/* Input Mode Segmented Switch */}
            <div className="grid grid-cols-3 gap-1 bg-slate-100 dark:bg-slate-800/80 p-1 rounded-lg text-xs font-medium">
              <button
                onClick={() => setActiveTab('library')}
                className={`py-1.5 rounded-md transition-all ${activeTab === 'library' ? 'bg-white dark:bg-slate-900 text-slate-900 dark:text-white shadow-sm font-semibold' : 'text-slate-500 dark:text-slate-400 hover:text-slate-800'}`}
              >
                Case Studies
              </button>
              <button
                onClick={() => setActiveTab('live')}
                className={`py-1.5 rounded-md transition-all ${activeTab === 'live' ? 'bg-white dark:bg-slate-900 text-slate-900 dark:text-white shadow-sm font-semibold' : 'text-slate-500 dark:text-slate-400 hover:text-slate-800'}`}
              >
                Raw Text
              </button>
              <button
                onClick={() => setActiveTab('json')}
                className={`py-1.5 rounded-md transition-all ${activeTab === 'json' ? 'bg-white dark:bg-slate-900 text-slate-900 dark:text-white shadow-sm font-semibold' : 'text-slate-500 dark:text-slate-400 hover:text-slate-800'}`}
              >
                JSON
              </button>
            </div>

            {/* Mode 1: Case Studies */}
            {activeTab === 'library' && (
              <div className="space-y-4">
                <div className="space-y-1.5">
                  <label className="text-xs font-medium text-slate-700 dark:text-slate-300">Select Case Study</label>
                  <select
                    value={selectedCase}
                    onChange={e => setSelectedCase(e.target.value)}
                    className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-900 dark:text-slate-100 outline-none focus:border-blue-500"
                  >
                    {cases.map(c => (
                      <option key={c.file} value={c.file}>
                        {c.title} ({c.documents} docs)
                      </option>
                    ))}
                  </select>
                </div>

                {/* Case Metadata */}
                {selectedCaseObj && (
                  <div className="p-3.5 rounded-lg bg-slate-50 dark:bg-slate-950/60 border border-slate-200 dark:border-slate-800/80 text-xs space-y-2">
                    <div className="flex items-center justify-between text-[11px]">
                      <span className="font-mono text-slate-500">{selectedCaseObj.case_id}</span>
                      <span className="px-2 py-0.5 rounded bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 font-medium">
                        {selectedCaseObj.documents} Documents
                      </span>
                    </div>
                    <div className="font-medium text-slate-800 dark:text-slate-200 leading-snug">
                      {selectedCaseObj.title}
                    </div>
                  </div>
                )}

                {/* Attached Docs Preview */}
                {currentDossierDetails && currentDossierDetails.documents && (
                  <div className="space-y-1.5">
                    <span className="text-[11px] font-medium text-slate-500 uppercase tracking-wider block">Attached Documents</span>
                    <div className="space-y-1">
                      {currentDossierDetails.documents.map((doc, i) => (
                        <div key={i} className="px-2.5 py-1.5 rounded bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800/80 text-xs flex items-center justify-between">
                          <span className="font-mono text-slate-600 dark:text-slate-300 text-[11px]">{doc.doc_id}</span>
                          <span className="text-slate-500 capitalize text-[11px]">{doc.doc_type.replace(/_/g, ' ')}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* Mode 2: Raw Text */}
            {activeTab === 'live' && (
              <div className="space-y-3">
                <textarea
                  value={rawText}
                  onChange={e => setRawText(e.target.value)}
                  placeholder="Paste document text here. Separate multiple documents with --- lines."
                  className="w-full h-36 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg p-3 text-xs font-mono outline-none focus:border-blue-500"
                />
                <button
                  onClick={() => setRawText("TAX INVOICE\nSupplier: Cascade Brake Systems Pvt Ltd\nCIN: U29304TZ2018PTC030111\nGSTIN: 33AAACC1234F1Z5\nDate: 2026-02-10\nItem: Brake Shoe Lot BS-7702\n---\nFORM 23 CERTIFICATE\nIssued to: Cascade Brake Systems Pvt Ltd\nAddress: Industrial Estate, Hosur, Tamil Nadu")}
                  className="text-[11px] text-blue-600 dark:text-blue-400 hover:underline"
                >
                  Insert Sample Text
                </button>
              </div>
            )}

            {/* Mode 3: JSON */}
            {activeTab === 'json' && (
              <textarea
                value={jsonText}
                onChange={e => setJsonText(e.target.value)}
                placeholder='{"case_id": "custom", "documents": [...]}'
                className="w-full h-36 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg p-3 text-xs font-mono outline-none focus:border-blue-500"
              />
            )}

            {/* Rules Only Switch */}
            <div className="flex items-center justify-between pt-2 border-t border-slate-100 dark:border-slate-800/80">
              <span className="text-xs text-slate-600 dark:text-slate-400 font-medium">Rules-only mode (Deterministic)</span>
              <button
                type="button"
                onClick={() => setRulesOnly(!rulesOnly)}
                className={`w-9 h-5 rounded-full transition-colors relative ${rulesOnly ? 'bg-blue-600' : 'bg-slate-200 dark:bg-slate-700'}`}
              >
                <span className={`w-3.5 h-3.5 bg-white rounded-full absolute top-0.75 transition-transform ${rulesOnly ? 'translate-x-4' : 'translate-x-0.75'}`} />
              </button>
            </div>

            {/* Run CTA Button */}
            <button
              onClick={() => {
                if (activeTab === 'library') handleRunSelectCase();
                else if (activeTab === 'live') handleRunRawText();
                else handleRunJson();
              }}
              disabled={isAnalyzing}
              className="w-full py-2.5 rounded-lg bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-semibold text-xs transition-all hover:bg-slate-800 dark:hover:bg-slate-100 disabled:opacity-50 flex items-center justify-center gap-2 shadow-sm"
            >
              {isAnalyzing ? (
                <>
                  <RefreshIcon className="w-3.5 h-3.5 animate-spin" />
                  <span>Analyzing Dossier...</span>
                </>
              ) : (
                <>
                  <PlayIcon className="w-3 h-3" />
                  <span>Run Verification Pipeline</span>
                </>
              )}
            </button>
          </div>

          {/* System Constraints */}
          <div className="panel-base p-4 space-y-2 text-xs">
            <h3 className="font-semibold text-slate-800 dark:text-slate-200 text-xs">Architecture Scope</h3>
            <ul className="space-y-1 text-slate-500 dark:text-slate-400 text-[11px] list-disc list-inside">
              <li>Offline MCA company registry matching</li>
              <li>Pure validator checks (checksums, ROC codes, dates)</li>
              <li>Dual-hypothesis benign vs. malicious reasoning</li>
            </ul>
          </div>
        </aside>

        {/* RIGHT COLUMN: MAIN CANVAS (8 Cols) */}
        <section className="lg:col-span-8 space-y-6">
          
          {/* STEPPER PROGRESS BAR */}
          <div className="panel-base p-4 space-y-3">
            <div className="flex items-center justify-between text-xs">
              <span className="font-semibold text-slate-900 dark:text-white">Pipeline Execution Progress</span>
              <span className="font-mono text-[11px] text-slate-500">{status}</span>
            </div>

            <div className="grid grid-cols-5 gap-2 pt-1">
              {[
                { num: 1, name: 'Extract' },
                { num: 2, name: 'Validate' },
                { num: 3, name: 'Ledger' },
                { num: 4, name: 'Reason' },
                { num: 5, name: 'Verdict' },
              ].map(s => {
                const isDone = pipelineStage > s.num || (pipelineStage === 5 && result);
                const isActive = pipelineStage === s.num && !result;

                return (
                  <div key={s.num} className="space-y-1.5">
                    <div className={`h-1.5 rounded-full transition-all ${
                      isDone ? 'bg-emerald-500' : isActive ? 'bg-blue-600 animate-pulse' : 'bg-slate-200 dark:bg-slate-800'
                    }`} />
                    <div className="flex items-center justify-between text-[11px]">
                      <span className={`font-medium ${isDone || isActive ? 'text-slate-900 dark:text-slate-100' : 'text-slate-400'}`}>
                        {s.name}
                      </span>
                      {isDone && <CheckCircleIcon className="w-3 h-3 text-emerald-500" />}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* INJECTION WARNING */}
          {result && result.injection_flags?.length > 0 && (
            <div className="p-4 rounded-xl bg-rose-50 dark:bg-rose-950/30 border border-rose-200 dark:border-rose-900/50 text-xs text-rose-800 dark:text-rose-300 space-y-2">
              <div className="flex items-center gap-2 font-semibold text-rose-700 dark:text-rose-400">
                <AlertTriangleIcon className="w-4 h-4 text-rose-600" />
                <span>Prompt Injection Blocked & Logged into Ledger</span>
              </div>
              <p className="text-slate-600 dark:text-slate-300 text-[11px]">
                Instruction-like lines were stripped from raw text before LLM reasoning and logged as tamper evidence.
              </p>
            </div>
          )}

          {/* NO RESULT PLACEHOLDER */}
          {!result && !isAnalyzing && (
            <div className="panel-base p-12 text-center space-y-3">
              <div className="w-12 h-12 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-400 flex items-center justify-center mx-auto">
                <ShieldIcon className="w-6 h-6" />
              </div>
              <h3 className="text-sm font-semibold text-slate-800 dark:text-slate-200">No Investigation Active</h3>
              <p className="text-xs text-slate-500 max-w-sm mx-auto">
                Select a prepared dossier study on the left or paste raw document text, then click "Run Verification Pipeline" to begin analysis.
              </p>
            </div>
          )}

          {/* VERDICT HERO & AUDIT LEDGER */}
          {result && (
            <div className="space-y-6">
              
              {/* Verdict Summary Card */}
              <div className="panel-base p-6 space-y-5">
                <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 border-b border-slate-100 dark:border-slate-800 pb-5">
                  <div className="space-y-1">
                    <span className="text-[11px] font-medium text-slate-400 uppercase tracking-wider block">Pipeline Verdict</span>
                    <div className="flex items-center gap-3">
                      <h2 className={`text-3xl font-bold font-mono tracking-tight ${
                        result.verdict === 'GENUINE' ? 'text-emerald-600 dark:text-emerald-400' : result.verdict === 'SUSPECT' ? 'text-rose-600 dark:text-rose-400' : 'text-amber-600 dark:text-amber-400'
                      }`}>
                        {result.verdict}
                      </h2>
                      <span className={`px-2.5 py-0.5 rounded-full text-xs font-medium border ${
                        result.verdict === 'GENUINE'
                          ? 'bg-emerald-50 text-emerald-700 border-emerald-200 dark:bg-emerald-950/50 dark:text-emerald-300 dark:border-emerald-800'
                          : result.verdict === 'SUSPECT'
                          ? 'bg-rose-50 text-rose-700 border-rose-200 dark:bg-rose-950/50 dark:text-rose-300 dark:border-rose-800'
                          : 'bg-amber-50 text-amber-700 border-amber-200 dark:bg-amber-950/50 dark:text-amber-300 dark:border-amber-800'
                      }`}>
                        {result.subtype || 'standard'}
                      </span>
                    </div>
                  </div>

                  {/* Findings breakdown counts */}
                  <div className="flex items-center gap-4 text-xs font-mono">
                    <div className="text-center px-3 py-1.5 rounded-lg bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800">
                      <div className="font-bold text-rose-600 dark:text-rose-400 text-base">{result.counts.supports_suspect}</div>
                      <div className="text-[10px] text-slate-400">Suspect</div>
                    </div>
                    <div className="text-center px-3 py-1.5 rounded-lg bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800">
                      <div className="font-bold text-emerald-600 dark:text-emerald-400 text-base">{result.counts.supports_genuine}</div>
                      <div className="text-[10px] text-slate-400">Genuine</div>
                    </div>
                    <div className="text-center px-3 py-1.5 rounded-lg bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800">
                      <div className="font-bold text-slate-500 text-base">{result.counts.neutral}</div>
                      <div className="text-[10px] text-slate-400">Neutral</div>
                    </div>
                  </div>
                </div>

                {/* UNVERIFIABLE missing artefact notice */}
                {result.verdict === 'UNVERIFIABLE' && (
                  <div className="p-4 rounded-lg bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-900/50 space-y-2 text-xs">
                    <div className="font-semibold text-amber-800 dark:text-amber-300">Decisive Missing Artefact</div>
                    <p className="text-amber-900 dark:text-amber-200 font-medium">{result.missing_artefact}</p>
                    <div className="text-slate-600 dark:text-slate-400 text-[11px] pt-1">
                      <b>Interim Action:</b> {result.interim_action}
                    </div>
                  </div>
                )}

                {/* Protocol Actions Grid */}
                <div className="space-y-2">
                  <h4 className="text-xs font-semibold text-slate-900 dark:text-white">Protocol Action Directives</h4>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
                    {Object.entries(result.actions || {}).map(([role, text]) => (
                      <div key={role} className="p-3 rounded-lg bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 space-y-1">
                        <span className="font-medium text-slate-900 dark:text-white capitalize text-[11px] block">{role}</span>
                        <p className="text-slate-600 dark:text-slate-400 leading-relaxed text-[11px]">{text}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              {/* TABBED MAIN INSPECTOR */}
              <div className="panel-base p-6 space-y-5">
                
                <div className="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3 flex-wrap gap-3">
                  <div className="flex items-center gap-1 bg-slate-100 dark:bg-slate-800 p-0.5 rounded-lg text-xs font-medium">
                    <button
                      onClick={() => setActiveMainTab('ledger')}
                      className={`px-3 py-1.5 rounded-md transition-all ${activeMainTab === 'ledger' ? 'bg-white dark:bg-slate-900 text-slate-900 dark:text-white shadow-sm font-semibold' : 'text-slate-500 hover:text-slate-800'}`}
                    >
                      Audit Ledger ({filteredFindings.length})
                    </button>
                    <button
                      onClick={() => setActiveMainTab('deliberation')}
                      className={`px-3 py-1.5 rounded-md transition-all ${activeMainTab === 'deliberation' ? 'bg-white dark:bg-slate-900 text-slate-900 dark:text-white shadow-sm font-semibold' : 'text-slate-500 hover:text-slate-800'}`}
                    >
                      Agent Deliberation
                    </button>
                    {currentDossierDetails && (
                      <button
                        onClick={() => setActiveMainTab('documents')}
                        className={`px-3 py-1.5 rounded-md transition-all ${activeMainTab === 'documents' ? 'bg-white dark:bg-slate-900 text-slate-900 dark:text-white shadow-sm font-semibold' : 'text-slate-500 hover:text-slate-800'}`}
                      >
                        Source Docs
                      </button>
                    )}
                  </div>

                  {/* Search bar inside ledger */}
                  {activeMainTab === 'ledger' && (
                    <div className="relative">
                      <input
                        type="text"
                        value={searchQuery}
                        onChange={e => setSearchQuery(e.target.value)}
                        placeholder="Filter findings..."
                        className="bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-md pl-8 pr-3 py-1 text-xs text-slate-900 dark:text-slate-100 outline-none focus:border-blue-500 w-48"
                      />
                      <SearchIcon className="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-2" />
                    </div>
                  )}
                </div>

                {/* TAB 1: AUDIT LEDGER TABLE */}
                {activeMainTab === 'ledger' && (
                  <div className="space-y-4">
                    {/* Dimension / Filter Pills */}
                    <div className="flex items-center gap-1.5 flex-wrap text-xs">
                      <span className="text-[11px] text-slate-400 font-medium mr-1">Filter:</span>
                      {['all', 'identity', 'certification', 'custody', 'provenance'].map(dim => (
                        <button
                          key={dim}
                          onClick={() => setActiveDim(dim)}
                          className={`px-2.5 py-0.5 rounded text-[11px] font-medium transition-all ${
                            activeDim === dim
                              ? 'bg-slate-900 dark:bg-white text-white dark:text-slate-900'
                              : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-200'
                          }`}
                        >
                          {dim}
                        </button>
                      ))}
                    </div>

                    {/* Clean Table */}
                    <div className="overflow-x-auto rounded-lg border border-slate-200 dark:border-slate-800">
                      <table className="w-full text-left text-xs">
                        <thead className="bg-slate-50 dark:bg-slate-950 text-slate-500 font-medium text-[11px] border-b border-slate-200 dark:border-slate-800">
                          <tr>
                            <th className="p-3">Check</th>
                            <th className="p-3">Assertion & Detail</th>
                            <th className="p-3">Tier</th>
                            <th className="p-3">Direction</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100 dark:divide-slate-800/60">
                          {filteredFindings.map((f, idx) => (
                            <tr key={idx} className="hover:bg-slate-50/60 dark:hover:bg-slate-900/40">
                              <td className="p-3 align-top font-mono font-medium text-slate-700 dark:text-slate-300 text-[11px] whitespace-nowrap">
                                {f.check}
                              </td>
                              <td className="p-3 align-top space-y-0.5">
                                <div className="font-semibold text-slate-900 dark:text-slate-100 text-xs">{f.assertion}</div>
                                <div className="text-slate-500 dark:text-slate-400 text-xs leading-relaxed">{f.detail}</div>
                              </td>
                              <td className="p-3 align-top whitespace-nowrap">
                                <span className={`px-2 py-0.5 rounded text-[10px] font-mono font-medium ${
                                  f.source_tier === 'authoritative'
                                    ? 'bg-blue-50 text-blue-700 dark:bg-blue-950 dark:text-blue-300'
                                    : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400'
                                }`}>
                                  {f.source_tier}
                                </span>
                              </td>
                              <td className="p-3 align-top whitespace-nowrap">
                                <span className={`px-2.5 py-1 rounded-md text-[11px] font-medium inline-flex items-center gap-1.5 ${
                                  f.direction === 'supports_genuine'
                                    ? 'bg-emerald-50 text-emerald-700 dark:bg-emerald-950/50 dark:text-emerald-400'
                                    : f.direction === 'supports_suspect'
                                    ? 'bg-rose-50 text-rose-700 dark:bg-rose-950/50 dark:text-rose-400'
                                    : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400'
                                }`}>
                                  {f.direction === 'supports_genuine' ? <CheckCircleIcon className="w-3 h-3" /> : f.direction === 'supports_suspect' ? <XCircleIcon className="w-3 h-3" /> : null}
                                  {f.direction.replace('supports_', '')}
                                </span>
                              </td>
                            </tr>
                          ))}
                          {filteredFindings.length === 0 && (
                            <tr>
                              <td colSpan="4" className="p-6 text-center text-slate-400 text-xs">
                                No findings match your filter query.
                              </td>
                            </tr>
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {/* TAB 2: AGENT DELIBERATION */}
                {activeMainTab === 'deliberation' && (
                  <div className="space-y-4 text-xs">
                    {result.reasoning && !result.rules_only ? (
                      <>
                        {result.reasoning.narrative && (
                          <div className="p-4 rounded-lg bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 leading-relaxed text-slate-700 dark:text-slate-300">
                            <span className="font-semibold text-slate-900 dark:text-white block mb-1">Executive Summary</span>
                            {result.reasoning.narrative}
                          </div>
                        )}

                        <div className="space-y-3">
                          <span className="font-semibold text-slate-900 dark:text-white block">Contradiction Analysis</span>
                          {(result.reasoning.contradictions || []).map((c, i) => (
                            <div key={i} className="p-4 rounded-lg bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 space-y-3">
                              <div className="flex items-center justify-between font-medium">
                                <span className="text-slate-900 dark:text-white">{c.topic}</span>
                                <span className="px-2 py-0.5 rounded bg-blue-50 text-blue-700 dark:bg-blue-950 dark:text-blue-300 text-[11px] font-mono">
                                  {c.resolved_direction}
                                </span>
                              </div>
                              <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                                <div className="p-3 rounded bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
                                  <span className="text-[10px] font-semibold uppercase text-emerald-600 block mb-1">Benign Hypothesis</span>
                                  {c.benign}
                                </div>
                                <div className="p-3 rounded bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
                                  <span className="text-[10px] font-semibold uppercase text-rose-600 block mb-1">Malicious Hypothesis</span>
                                  {c.malicious}
                                </div>
                              </div>
                              <p className="text-slate-600 dark:text-slate-400 text-[11px]">
                                <b>Resolution:</b> {c.resolution}
                              </p>
                            </div>
                          ))}
                        </div>
                      </>
                    ) : (
                      <div className="p-6 text-center text-slate-400">
                        {result.rules_only ? 'Rules-only execution bypassed LLM hypothesis deliberation.' : 'No deliberation record generated.'}
                      </div>
                    )}
                  </div>
                )}

                {/* TAB 3: SOURCE DOCUMENTS */}
                {activeMainTab === 'documents' && currentDossierDetails && (
                  <div className="space-y-4 text-xs">
                    {currentDossierDetails.documents?.map((doc, idx) => (
                      <div key={idx} className="p-4 rounded-lg bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 space-y-2">
                        <div className="flex items-center justify-between font-mono text-[11px] text-slate-500">
                          <span className="font-semibold text-slate-900 dark:text-white">[{doc.doc_id}] {doc.doc_type?.toUpperCase()}</span>
                          <span>{doc.text?.length || 0} chars</span>
                        </div>
                        <pre className="text-[11px] font-mono text-slate-700 dark:text-slate-300 whitespace-pre-wrap leading-relaxed bg-white dark:bg-slate-900 p-3 rounded border border-slate-200 dark:border-slate-800 max-h-48 overflow-y-auto">
                          {doc.text}
                        </pre>
                      </div>
                    ))}
                  </div>
                )}

              </div>

            </div>
          )}

        </section>

      </main>

      {/* ---------- FOOTER ---------- */}
      <footer className="mt-auto border-t border-slate-200 dark:border-slate-800/80 py-4 text-center text-xs text-slate-400 font-mono">
        PROVENANCE · Offline MCA Company Master Data Snapshot (2026-07-22)
      </footer>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
